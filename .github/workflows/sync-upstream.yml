# Keeps this fork up to date with Supermedo/uncharted_pc. Upstream's main is merged into the
# branch upstream-merge, the Linux build runs on that, and only a passing merge reaches main
# (which then publishes a release). README.md is the fork's own: when both sides changed it,
# the fork's version is kept. A conflict or a failing build opens a pull request instead, to be
# resolved by hand; main is not touched. The `upstream` branch is an exact copy of upstream.
name: Sync with upstream

on:
  # Automatic syncing disabled: manual trigger only to prevent foreign code from silently replacing builds
  workflow_dispatch:
    inputs:  # for testing the workflow against another source; normally left as they are
      repo:
        description: Upstream repository
        default: Supermedo/uncharted_pc
      branch:
        description: Upstream branch
        default: main

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.merge.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream into upstream-merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          repo=${{ inputs.repo || 'Supermedo/uncharted_pc' }}
          branch=${{ inputs.branch || 'main' }}
          git remote add upstream "https://github.com/$repo.git"
          git fetch upstream "$branch:refs/remotes/upstream/main"
          if [ "$repo" = Supermedo/uncharted_pc ]; then
            git push --force origin upstream/main:refs/heads/upstream
          fi
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Already up to date.'; echo 'result=current' >> "$GITHUB_OUTPUT"; exit 0
          fi
          git checkout -B upstream-merge
          if ! git merge --no-edit -m 'Merge upstream Supermedo/uncharted_pc' upstream/main; then
            git checkout --ours README.md 2>/dev/null && git add README.md || true
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              files=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
              git merge --abort
              if [ -z "$(gh pr list --head upstream --base main --state open --json number -q '.[].number')" ]; then
                gh pr create --head upstream --base main --title 'Upstream changes need a manual merge' \
                  --body "Merging Supermedo/uncharted_pc into main conflicts in:
          $files

          Resolve the conflicts in this pull request, then merge it."
              fi
              echo 'result=conflict' >> "$GITHUB_OUTPUT"; exit 0
            fi
            git commit --no-edit
          fi
          git push --force origin HEAD:refs/heads/upstream-merge
          echo 'result=merged' >> "$GITHUB_OUTPUT"

  build:
    needs: merge
    if: needs.merge.outputs.result == 'merged'
    uses: ./.github/workflows/build.yml
    with:
      ref: upstream-merge

  land:
    needs: [merge, build]
    if: always() && needs.merge.outputs.result == 'merged'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Put the merge on main, or open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build.result }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin upstream-merge
          if [ "$BUILD" = success ]; then
            # main may have moved while the build ran (README edits): merge, keeping its README.
            if git merge --no-edit origin/upstream-merge || { git checkout --ours README.md && git add README.md && git commit --no-edit; }; then
              git push origin HEAD:main
              git push origin --delete upstream-merge || true  # staging only; main has it now
              gh workflow run build.yml --ref main
              exit 0
            fi
          fi
          if [ -z "$(gh pr list --head upstream-merge --base main --state open --json number -q '.[].number')" ]; then
            gh pr create --head upstream-merge --base main --title 'Upstream changes break the Linux build' \
              --body "The latest Supermedo/uncharted_pc changes merge cleanly but the Linux build failed (build result: $BUILD), so main was left as it is. See the Sync with upstream run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Fix the build on the upstream-merge branch, then merge this pull request."
          fi
          exit 1
